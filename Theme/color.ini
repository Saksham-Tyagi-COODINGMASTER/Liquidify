; Liquidify colour schemes. Spicetify only accepts 6-digit hex (no #).
; The *accent* keys (button, button-active, equalizer) are overridden at runtime
; by the dynamic album-art colours; the values here are the fallback palette.
[Base]
text               = f5f5f7
subtext            = a1a1a6
main               = 0b0b10
main-elevated      = 1c1c22
highlight          = 2a2a32
highlight-elevated = 34343d
sidebar            = 0b0b10
player             = 0b0b10
card               = 1c1c22
shadow             = 000000
selected-row       = ffffff
button             = 8b7cf6
button-active      = b49cff
button-disabled    = 55555c
tab-active         = 2a2a32
notification       = 2a2a32
notification-error = ff5f57
equalizer          = b49cff
misc               = 3a3a42
